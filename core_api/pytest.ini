[tool:pytest]
# ── 测试路径 ──
testpaths = tests

# ── 默认选项 ──
addopts =
    -v
    -s
    --tb=short
    --strict-markers
    --strict-config
    -p no:cacheprovider

# ── 标记注册 ──
markers =
    unit: 单元测试（纯逻辑，不涉及 IO/网络/数据库）
    integration: 集成测试（需要 FastAPI TestClient + SQLite :memory:）
    slow: 慢速测试（如 PDF 解析、大数据量分页）

# ── Python 路径（确保 app/ 可被导入） ──
pythonpath = .

# ── 日志配置 ──
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %H:%M:%S

# ── 警告过滤 ──
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::sqlalchemy.exc.SADeprecationWarning

# ── 超时（可选，需 pytest-timeout 插件） ──
 timeout = 30
